<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f8f2" />
    <title>ЭФТ — React-калькулятор СИП-домов</title>
    <link rel="icon" type="image/svg+xml" href="./icons/eft-favicon.svg?v=297" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/eft-app-192.png?v=297" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-recovery" hidden style="max-width:360px;margin:18vh auto;padding:24px;font:16px/1.5 system-ui,sans-serif;color:#234435;background:#fff;border:1px solid #d8e5d9;border-radius:14px;box-sizing:border-box">
      <strong>Приложение не загрузилось</strong>
      <p>Обновите страницу, чтобы получить актуальную версию.</p>
      <button type="button" id="boot-retry" style="padding:11px 15px;border:0;border-radius:8px;background:#315f58;color:#fff;font:inherit">Обновить приложение</button>
    </div>
    <script>
      const bootRoot = document.getElementById('root');
      const bootRecovery = document.getElementById('boot-recovery');
      const bootObserver = new MutationObserver(() => {
        if (bootRoot.childElementCount) { bootRecovery.hidden = true; bootObserver.disconnect(); }
      });
      bootObserver.observe(bootRoot, { childList: true });
      window.setTimeout(() => {
        if (!bootRoot.childElementCount) bootRecovery.hidden = false;
      }, 12000);
      document.getElementById('boot-retry').addEventListener('click', async () => {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(registration => registration.scope.startsWith(location.origin)).map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('eft-calculator-react-')).map(key => caches.delete(key)));
        }
        const url = new URL(location.href);
        url.searchParams.set('recovery', Date.now());
        location.replace(url);
      });
    </script>
    <script type="module" src="./src/react/main.jsx"></script>
  </body>
</html>
