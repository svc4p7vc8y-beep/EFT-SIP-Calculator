name: Deploy EFT public site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:public
      - name: Build standalone reserve calculator
        env:
          VITE_EFT_STANDALONE: 'true'
          VITE_TEAM_ENABLED: 'false'
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Add reserve calculator to Pages
        run: node scripts/prepare-github-reserve.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
