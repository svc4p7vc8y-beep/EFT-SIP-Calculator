name: Migrate EFT shared database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/beget-api/**'
      - '.github/workflows/beget-api-migrate.yml'
      - 'tests/price-catalog.integration.php'

permissions:
  contents: read

concurrency:
  group: beget-api-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: eft-test
          MYSQL_DATABASE: eft_price_test
        ports: ['33306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KNOWN_HOSTS: ${{ secrets.BEGET_SSH_KNOWN_HOSTS }}
        run: |
          : "${KNOWN_HOSTS:?Missing BEGET_SSH_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          sudo apt-get update
          sudo apt-get install --yes sshpass php-cli php-mysql php-mbstring
          find server/beget-api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test transactional price catalog on isolated MySQL
        env:
          EFT_PRICE_TEST_DSN: mysql:host=127.0.0.1;port=33306;dbname=eft_price_test;charset=utf8mb4
          EFT_PRICE_TEST_USER: root
          EFT_PRICE_TEST_PASSWORD: eft-test
        run: php tests/price-catalog.integration.php
      - name: Upload API and run idempotent migration
        env:
          HOST: ${{ secrets.BEGET_SSH_HOST }}
          USER: ${{ secrets.BEGET_SITE_SSH_USER }}
          SSHPASS: ${{ secrets.BEGET_SITE_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.BEGET_SITE_DEPLOY_PATH }}
          SETUP_TOKEN: ${{ secrets.EFT_SETUP_TOKEN }}
        run: |
          : "${HOST:?Missing BEGET_SSH_HOST}"
          : "${USER:?Missing BEGET_SITE_SSH_USER}"
          : "${SSHPASS:?Missing BEGET_SITE_SSH_PASSWORD}"
          : "${DEPLOY_PATH:?Missing BEGET_SITE_DEPLOY_PATH}"
          : "${SETUP_TOKEN:?Missing EFT_SETUP_TOKEN}"
          SSH_COMMAND="ssh -p 22 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes"
          API_DIR="${DEPLOY_PATH%/}/api"
          sshpass -e $SSH_COMMAND "${USER}@${HOST}" "mkdir -p '${API_DIR}'"
          sshpass -e rsync -az --checksum --omit-dir-times --no-perms --no-owner --no-group \
            --exclude='/config.local.php' --exclude='/config.local.php.pending-*' \
            -e "$SSH_COMMAND" server/beget-api/ "${USER}@${HOST}:${API_DIR}/"
          RESPONSE="$(curl --fail --silent --show-error --max-time 45 -X POST -H "X-EFT-Setup-Token: ${SETUP_TOKEN}" 'https://eftsip.ru/api/migrate.php')"
          printf '%s' "$RESPONSE" | jq -e '.ok == true' > /dev/null
