name: Switch calculator to employee login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beget-calculator-auth-cutover.yml'

permissions:
  contents: read

concurrency:
  group: beget-calculator-auth-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          HOST: ${{ secrets.BEGET_SSH_HOST }}
          USER: ${{ secrets.BEGET_SSH_USER }}
          PASSWORD: ${{ secrets.BEGET_SSH_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.BEGET_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.BEGET_DEPLOY_PATH }}
        run: |
          : "${HOST:?Missing BEGET_SSH_HOST}"
          : "${USER:?Missing BEGET_SSH_USER}"
          : "${PASSWORD:?Missing BEGET_SSH_PASSWORD}"
          : "${KNOWN_HOSTS:?Missing BEGET_SSH_KNOWN_HOSTS}"
          : "${DEPLOY_PATH:?Missing BEGET_DEPLOY_PATH}"
          [[ "$DEPLOY_PATH" = "." || "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]*$ ]]

      - name: Configure SSH
        env:
          KNOWN_HOSTS: ${{ secrets.BEGET_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Back up and disable shared Basic Auth
        env:
          HOST: ${{ secrets.BEGET_SSH_HOST }}
          USER: ${{ secrets.BEGET_SSH_USER }}
          SSHPASS: ${{ secrets.BEGET_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.BEGET_DEPLOY_PATH }}
        run: |
          remote_path="${DEPLOY_PATH%/}"
          [ -n "$remote_path" ] || remote_path="/"
          backup_dir="${remote_path%/}/.eft-backups/basic-auth-${GITHUB_RUN_ID}"
          sshpass -e ssh -p 22 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "${USER}@${HOST}" \
            "set -eu
             cd '${remote_path}'
             test -f .htaccess
             test -f .htpasswd
             mkdir -p '${backup_dir}'
             chmod 700 '${remote_path%/}/.eft-backups' '${backup_dir}'
             cp .htaccess '${backup_dir}/.htaccess'
             cp .htpasswd '${backup_dir}/.htpasswd'
             chmod 600 '${backup_dir}/.htaccess' '${backup_dir}/.htpasswd'
             awk '
               BEGIN { IGNORECASE = 1 }
               /^[[:space:]]*AuthType[[:space:]]+Basic([[:space:]]|$)/ { next }
               /^[[:space:]]*AuthName[[:space:]]/ { next }
               /^[[:space:]]*AuthUserFile[[:space:]]/ { next }
               /^[[:space:]]*Require[[:space:]]+valid-user([[:space:]]|$)/ { next }
               { print }
             ' .htaccess > .htaccess.employee-login
             if grep -Eiq '^[[:space:]]*(AuthType|AuthUserFile|Require[[:space:]]+valid-user)' .htaccess.employee-login; then
               rm -f .htaccess.employee-login
               exit 1
             fi
             mv .htaccess.employee-login .htaccess
             chmod 644 .htaccess"

      - name: Verify personal employee login is reachable
        env:
          HOST: ${{ secrets.BEGET_SSH_HOST }}
          USER: ${{ secrets.BEGET_SSH_USER }}
          SSHPASS: ${{ secrets.BEGET_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.BEGET_DEPLOY_PATH }}
        run: |
          if response="$(curl --fail --silent --show-error --max-time 30 'https://calc.eftsip.ru/?auth=cutover')" \
            && printf '%s' "$response" | grep -q 'React-калькулятор СИП-домов'; then
            exit 0
          fi
          remote_path="${DEPLOY_PATH%/}"
          [ -n "$remote_path" ] || remote_path="/"
          backup_dir="${remote_path%/}/.eft-backups/basic-auth-${GITHUB_RUN_ID}"
          sshpass -e ssh -p 22 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "${USER}@${HOST}" \
            "set -eu; cp '${backup_dir}/.htaccess' '${remote_path%/}/.htaccess'; chmod 644 '${remote_path%/}/.htaccess'"
          echo "Employee login page was not reachable; Basic Auth configuration restored." >&2
          exit 1
