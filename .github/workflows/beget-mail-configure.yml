name: Configure EFT mailbox on Beget

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and prepare private mail configuration
        env:
          MAIL_PASSWORD: ${{ secrets.EFT_SALE_MAIL_APP_PASSWORD }}
        run: |
          : "${MAIL_PASSWORD:?Missing EFT_SALE_MAIL_APP_PASSWORD}"
          MAIL_PASSWORD_B64="$(printf '%s' "$MAIL_PASSWORD" | base64 -w0)"
          mkdir -p .deploy-private
          chmod 700 .deploy-private
          cat > .deploy-private/mail.local.php <<PHP
          <?php
          declare(strict_types=1);
          return [
              'username' => 'sale@eftsip.ru',
              'password' => base64_decode('${MAIL_PASSWORD_B64}'),
              'imap_host' => 'imap.mail.ru',
              'imap_port' => 993,
              'smtp_host' => 'smtp.mail.ru',
              'smtp_port' => 465,
          ];
          PHP
          chmod 600 .deploy-private/mail.local.php
          sudo apt-get update
          sudo apt-get install --yes php-cli sshpass
          php -l .deploy-private/mail.local.php
      - name: Verify new mailbox credentials before replacing the active configuration
        env:
          MAIL_PASSWORD: ${{ secrets.EFT_SALE_MAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import imaplib
          import os
          import smtplib

          address = 'sale@eftsip.ru'
          password = os.environ['MAIL_PASSWORD']
          with imaplib.IMAP4_SSL('imap.mail.ru', 993, timeout=20) as inbox:
              inbox.login(address, password)
          with smtplib.SMTP_SSL('smtp.mail.ru', 465, timeout=20) as smtp:
              smtp.login(address, password)
          print('New mailbox IMAP and SMTP authentication succeeded; no mail was sent.')
          PY
      - name: Configure SSH host verification
        env:
          BEGET_SSH_KNOWN_HOSTS: ${{ secrets.BEGET_SSH_KNOWN_HOSTS }}
        run: |
          : "${BEGET_SSH_KNOWN_HOSTS:?Missing BEGET_SSH_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BEGET_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload private configuration
        env:
          HOST: ${{ secrets.BEGET_SSH_HOST }}
          USER: ${{ secrets.BEGET_SITE_SSH_USER }}
          SSHPASS: ${{ secrets.BEGET_SITE_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.BEGET_SITE_DEPLOY_PATH }}
        run: |
          : "${HOST:?Missing BEGET_SSH_HOST}"
          : "${USER:?Missing BEGET_SITE_SSH_USER}"
          : "${SSHPASS:?Missing BEGET_SITE_SSH_PASSWORD}"
          : "${DEPLOY_PATH:?Missing BEGET_SITE_DEPLOY_PATH}"
          SSH_COMMAND="ssh -p 22 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes"
          sshpass -e rsync -az --chmod=F600 -e "$SSH_COMMAND" .deploy-private/mail.local.php "${USER}@${HOST}:${DEPLOY_PATH%/}/api/mail.local.php"
      - name: Verify IMAP connection without sending mail
        env:
          SETUP_TOKEN: ${{ secrets.EFT_SETUP_TOKEN }}
        run: |
          : "${SETUP_TOKEN:?Missing EFT_SETUP_TOKEN}"
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' --max-time 45 -X POST -H "X-EFT-Setup-Token: ${SETUP_TOKEN}" 'https://eftsip.ru/api/mail-check.php')"
          RESPONSE="$(cat "$RESPONSE_FILE")"
          rm -f "$RESPONSE_FILE"
          printf 'Mail check HTTP status: %s\n' "$STATUS"
          printf '%s' "$RESPONSE" | jq '{ok, code, message, mail}'
          test "$STATUS" = "200"
          printf '%s' "$RESPONSE" | jq -e '.ok == true and .mail.configured == true and .mail.imapAvailable == true and .mail.address == "sale@eftsip.ru" and .imap == true and .smtp == true' > /dev/null
