<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">Планировка дома 14 на 11 метров</title>
  <desc id="desc">По предоставленному эскизу: терраса сверху, крыльцо снизу, кухня-гостиная слева, три спальни справа и снизу, два санузла, гардеробная, котельная и прихожая.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5e9df" stroke-width=".7"/></pattern>
    <pattern id="deck" width="15" height="15" patternUnits="userSpaceOnUse"><rect width="15" height="15" fill="#e8ddc9"/><path d="M7 0v15" stroke="#b79e78" stroke-width="1.2"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#365744" flood-opacity=".13"/></filter>
    <style>.wall{fill:none;stroke:#314c3e;stroke-width:5}.partition{fill:none;stroke:#52685a;stroke-width:3.5}.window{stroke:#3eafbb;stroke-width:6}.door{fill:none;stroke:#3eafbb;stroke-width:2.4}.room{fill:#254634;font:600 15px Arial,sans-serif;text-anchor:middle}.small{font-size:11px}.tiny{font-size:10px}.metric{fill:#5d7464;font:12px Arial,sans-serif;text-anchor:middle}.area{fill:#244b3b;font:700 17px Arial,sans-serif;text-anchor:middle}.compact{font-size:14px}.dim{fill:#254634;font:700 17px Arial,sans-serif;text-anchor:middle}.eyebrow{fill:#6a806e;font:700 11px Arial,sans-serif;letter-spacing:2px}</style>
  </defs>
  <rect width="720" height="620" fill="#f8f8f2"/><rect width="720" height="620" fill="url(#grid)"/>
  <text x="96" y="28" class="eyebrow">ЭФТ / ПЛАНИРОВОЧНОЕ РЕШЕНИЕ</text>
  <path d="M179 54v110M590 54v110M179 54h411M139 166h36M139 486h36M139 166v320" fill="none" stroke="#839585" stroke-width="1"/>
  <path d="m179 54 6-3v6zm411 0-6-3v6zM139 166l-3 6h6zm0 320-3-6h6z" fill="#526c58"/>
  <rect x="309" y="37" width="150" height="30" rx="15" fill="#f8f8f2"/>
  <text x="384" y="58" class="dim">14 000 мм</text><text x="126" y="326" class="dim" transform="rotate(-90 126 326)">11 000 мм</text>
  <g filter="url(#shadow)">
    <rect x="169" y="82" width="224" height="84" fill="url(#deck)" stroke="#aa8c61" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="179" y="166" width="411" height="320" fill="#fcfbf5"/>
    <rect x="182" y="169" width="202" height="195" fill="#edf2e9"/>
    <rect x="385" y="169" width="82" height="122" fill="#e9f2ef"/>
    <rect x="469" y="169" width="118" height="122" fill="#f1eee4"/>
    <rect x="521" y="293" width="66" height="70" fill="#e9f2ef"/>
    <rect x="182" y="427" width="121" height="56" fill="#e9f2ef"/>
    <rect x="305" y="366" width="72" height="117" fill="#f2eee4"/>
    <rect x="380" y="366" width="102" height="117" fill="#f1eee4"/>
    <rect x="485" y="366" width="102" height="117" fill="#f1eee4"/>
    <rect x="296" y="486" width="93" height="65" fill="url(#deck)" stroke="#aa8c61" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="179" y="166" width="411" height="320" class="wall"/>
    <path class="partition" d="M384 166v125M384 231h83M467 166v125M384 291h27m26 0h36m26 0h37m26 0h28M520 291v73M284 364h44m27 0h94m27 0h13m27 0h74M303 364v122M179 425h124M378 364v122M483 364v122"/>
  </g>
  <path class="window" d="M213 166h32m57 0h31m182 0h31M179 208v32m0 70v32M227 486h32m73 0h23m60 0h32m72 0h30"/>
  <path class="door" d="M411 291v26a26 26 0 0 0 26-26m36 0v-26a26 26 0 0 1 26 26m63 0v-26a26 26 0 0 0-26 26M328 364v26a26 26 0 0 0 26-26m95 0v26a26 26 0 0 0 26-26m14 0v26a26 26 0 0 0 26-26M328 486v24h30v-24"/>
  <path d="M323 551v16h36v-16" fill="none" stroke="#526c58" stroke-width="2"/>
  <text x="281" y="119" class="room">Терраса</text><text x="281" y="141" class="metric">17,5 м²</text>
  <text x="282" y="244" class="room">Кухня-гостиная</text><text x="282" y="267" class="metric">11,4 × 8,7 м</text><text x="282" y="292" class="area">64,31 м²</text>
  <text x="426" y="190" class="room small">Санузел 1</text><text x="426" y="207" class="metric">2,8 × 2,1 м</text><text x="426" y="223" class="area compact">5,61 м²</text>
  <text x="426" y="251" class="room small">Санузел 2</text><text x="426" y="268" class="metric">2,8 × 2,0 м</text><text x="426" y="284" class="area compact">5,17 м²</text>
  <text x="528" y="207" class="room">Спальня 1</text><text x="528" y="231" class="metric">4,0 × 4,1 м</text><text x="528" y="254" class="area">16,29 м²</text>
  <text x="555" y="318" class="room tiny">Гардеробная</text><text x="555" y="335" class="metric">2,2 × 2,5 м</text><text x="555" y="350" class="area compact">5,27 м²</text>
  <text x="241" y="444" class="room small">Котельная</text><text x="241" y="460" class="metric">4,1 × 1,9 м</text><text x="241" y="476" class="area compact">7,65 м²</text>
  <text x="341" y="410" class="room small">Прихожая</text><text x="341" y="430" class="metric">2,5 × 4,0 м</text><text x="341" y="451" class="area compact">9,59 м²</text>
  <text x="430" y="410" class="room small">Спальня 3</text><text x="430" y="430" class="metric">3,5 × 4,0 м</text><text x="430" y="451" class="area compact">13,56 м²</text>
  <text x="535" y="410" class="room small">Спальня 2</text><text x="535" y="430" class="metric">3,5 × 4,0 м</text><text x="535" y="451" class="area compact">13,86 м²</text>
  <text x="342" y="514" class="room compact">Крыльцо</text><text x="342" y="535" class="metric">4,9 м²</text>
  <text x="179" y="597" fill="#6a806e" font-family="Arial,sans-serif" font-size="11">Размеры и площади — по эскизу заказчика; требуют проверки в рабочем проекте.</text>
</svg>
