<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d">
  <title id="t">Сохранение и передача проекта</title><desc id="d">Схема автосохранения, файла проекта, библиотеки планов и файла для коллеги.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#6c9e51"/></marker><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity=".14"/></filter><style>.h{font:700 32px Arial,sans-serif;fill:#172016}.tx{font:700 21px Arial,sans-serif;fill:#172016}.sm{font:500 16px Arial,sans-serif;fill:#596555}.box{fill:#fff;stroke:#cbd8c5;stroke-width:2}.arrow{fill:none;stroke:#6c9e51;stroke-width:6;marker-end:url(#a)}.icon{fill:#e8f3e2;stroke:#4f8a2d;stroke-width:3}.n{fill:#4f8a2d}.nt{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}</style></defs>
  <rect width="1400" height="820" fill="#edf3e9"/><text x="60" y="70" class="h">Как не потерять работу и передать её коллеге</text>
  <g transform="translate(55 125)" filter="url(#s)"><rect width="270" height="230" rx="22" class="box"/><circle cx="135" cy="73" r="46" class="icon"/><path d="M110 75q25-38 50 0M104 82h62" fill="none" stroke="#4f8a2d" stroke-width="7"/><text x="135" y="150" class="tx" text-anchor="middle">Автосохранение</text><text x="135" y="181" class="sm" text-anchor="middle">Текущая версия</text><text x="135" y="205" class="sm" text-anchor="middle">в этом браузере</text></g>
  <path d="M325 240H455" class="arrow"/><g transform="translate(465 125)" filter="url(#s)"><rect width="300" height="230" rx="22" class="box"/><circle cx="150" cy="73" r="46" class="icon"/><path d="M128 45h44l18 18v48h-80V45zM132 45v25h38V45M130 92h40" fill="none" stroke="#4f8a2d" stroke-width="6"/><text x="150" y="150" class="tx" text-anchor="middle">Файл проекта</text><text x="150" y="181" class="sm" text-anchor="middle">.eft.json — план, параметры,</text><text x="150" y="205" class="sm" text-anchor="middle">прайс и смета</text></g>
  <path d="M765 240H895" class="arrow"/><g transform="translate(905 125)" filter="url(#s)"><rect width="440" height="230" rx="22" class="box"/><circle cx="220" cy="73" r="46" class="icon"/><path d="M195 78h50M220 53v50M180 110h80" fill="none" stroke="#4f8a2d" stroke-width="7"/><text x="220" y="150" class="tx" text-anchor="middle">Коллега открывает файл</text><text x="220" y="181" class="sm" text-anchor="middle">Его локальные цены можно сохранить</text><text x="220" y="205" class="sm" text-anchor="middle">или заменить ценами из файла</text></g>
  <g transform="translate(55 435)" filter="url(#s)"><rect width="395" height="245" rx="22" class="box"/><text x="28" y="48" class="tx">Библиотека планов</text><text x="28" y="85" class="sm">• Сохраняет карточку эскиза</text><text x="28" y="118" class="sm">• Показывает план и цену</text><text x="28" y="151" class="sm">• Позволяет открыть, копировать,</text><text x="28" y="176" class="sm">удалить и поделиться</text><circle cx="360" cy="42" r="22" class="n"/><text x="360" y="42" class="nt">1</text></g>
  <g transform="translate(500 435)" filter="url(#s)"><rect width="395" height="245" rx="22" class="box"/><text x="28" y="48" class="tx">Библиотека знаний</text><text x="28" y="85" class="sm">• Статьи и иллюстрации</text><text x="28" y="118" class="sm">• Импорт / экспорт одним файлом</text><text x="28" y="151" class="sm">• Печать карточки в PDF</text><text x="28" y="184" class="sm">• Свои тексты, таблицы и фото</text><circle cx="360" cy="42" r="22" class="n"/><text x="360" y="42" class="nt">2</text></g>
  <g transform="translate(945 435)" filter="url(#s)"><rect width="400" height="245" rx="22" class="box"/><text x="28" y="48" class="tx">Резервная копия</text><text x="28" y="85" class="sm">1. Нажмите дискету</text><text x="28" y="118" class="sm">2. Сохраните .eft.json в папку заказа</text><text x="28" y="151" class="sm">3. Дайте файлу понятное имя</text><text x="28" y="184" class="sm">4. Дублируйте перед крупной правкой</text><circle cx="365" cy="42" r="22" class="n"/><text x="365" y="42" class="nt">3</text></g>
  <rect x="280" y="730" width="840" height="55" rx="15" fill="#dfeeda"/><text x="700" y="765" class="tx" text-anchor="middle">Автосохранение не заменяет файл-копию на диске</text>
</svg>
