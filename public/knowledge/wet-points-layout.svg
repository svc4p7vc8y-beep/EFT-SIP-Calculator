<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Пример разводки мокрых точек в SIP-доме</title>
  <desc id="desc">Цветная схема холодной и горячей воды, канализации, коллектора и фанового стояка.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dfe8dd" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#23301f" flood-opacity=".16"/>
    </filter>
    <style>
      .room{fill:#fbfaf2;stroke:#1c261b;stroke-width:10}.partition{stroke:#1c261b;stroke-width:8}.label{font:700 25px Arial,sans-serif;fill:#172016}.small{font:500 19px Arial,sans-serif;fill:#465342}.note{font:600 20px Arial,sans-serif;fill:#172016}.cold{fill:none;stroke:#1687d9;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.hot{fill:none;stroke:#e8493f;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.sewer{fill:none;stroke:#82613b;stroke-width:19;stroke-linecap:round;stroke-linejoin:round}.fan{fill:none;stroke:#82613b;stroke-width:13;stroke-dasharray:18 12}.halo{fill:none;stroke:#fff;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}.fixture{fill:#fff;stroke:#1c261b;stroke-width:5}.point{fill:#fff;stroke-width:7}.callout{fill:#f4f8f0;stroke:#9bb58e;stroke-width:3}.number{fill:#4f8a2d}.number-text{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f6f8f3"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity=".65"/>
  <text x="70" y="70" class="label" font-size="34">Пример компактной разводки мокрых точек</text>
  <text x="70" y="108" class="small">Типовая схема: кухня, санузел и котельная собраны в одном инженерном ядре</text>

  <g filter="url(#shadow)">
    <rect x="80" y="150" width="1040" height="700" rx="8" class="room"/>
    <path d="M500 150V470M820 150V850M500 470H1120M820 650H1120" class="partition" fill="none"/>
  </g>
  <text x="255" y="310" class="label" text-anchor="middle">Гостиная</text>
  <text x="660" y="205" class="label" text-anchor="middle">Кухня</text>
  <text x="970" y="205" class="label" text-anchor="middle">Санузел</text>
  <text x="970" y="515" class="label" text-anchor="middle">Котельная</text>
  <text x="255" y="670" class="label" text-anchor="middle">Спальня</text>
  <text x="660" y="670" class="label" text-anchor="middle">Холл</text>
  <text x="970" y="700" class="label" text-anchor="middle">Постирочная</text>

  <!-- Сантехнические приборы -->
  <g>
    <rect x="610" y="250" width="105" height="62" rx="10" class="fixture"/><path d="M630 270h65v22h-65z" fill="#dcecf2"/><text x="662" y="342" class="small" text-anchor="middle">мойка</text>
    <rect x="745" y="250" width="48" height="70" rx="6" class="fixture"/><circle cx="769" cy="272" r="10" fill="#dcecf2"/><text x="769" y="342" class="small" text-anchor="middle">ПММ</text>
    <rect x="850" y="245" width="115" height="82" rx="24" class="fixture"/><path d="M870 267h75v38h-75z" fill="#dcecf2"/><text x="908" y="353" class="small" text-anchor="middle">ванна</text>
    <ellipse cx="1035" cy="275" rx="38" ry="28" class="fixture"/><circle cx="1035" cy="275" r="12" fill="#dcecf2"/><text x="1035" y="340" class="small" text-anchor="middle">раковина</text>
    <path d="M1010 390q25-32 50 0v52q-25 20-50 0z" class="fixture"/><ellipse cx="1035" cy="395" rx="22" ry="12" fill="#dcecf2"/><text x="1035" y="466" class="small" text-anchor="middle">унитаз</text>
    <rect x="850" y="715" width="80" height="92" rx="8" class="fixture"/><circle cx="890" cy="760" r="27" fill="#dcecf2" stroke="#1c261b" stroke-width="4"/><text x="890" y="834" class="small" text-anchor="middle">СМ</text>
    <rect x="990" y="560" width="78" height="135" rx="16" class="fixture"/><path d="M1008 583h42M1008 605h42" stroke="#1c261b" stroke-width="4"/><text x="1029" y="722" class="small" text-anchor="middle">водонагреватель</text>
  </g>

  <!-- Канализация под водой -->
  <path d="M1035 415V540H940V875" class="halo"/><path d="M1035 415V540H940V875" class="sewer"/>
  <path d="M660 305V390H940M769 305V390M908 310V390M1035 295V390M890 790V815H940" class="halo"/>
  <path d="M660 305V390H940M769 305V390M908 310V390M1035 295V390M890 790V815H940" class="sewer"/>
  <path d="M940 540V185" class="fan"/>

  <!-- Вода -->
  <path d="M1080 900V620H955V370H660V285M955 370H769V285M955 370H908V285M955 370H1035V275M955 620H890V745" class="halo"/>
  <path d="M1080 900V620H955V370H660V285M955 370H769V285M955 370H908V285M955 370H1035V275M955 620H890V745" class="cold"/>
  <path d="M1029 620H980V345H660V295M980 345H908V295M980 345H1035V285" class="halo"/>
  <path d="M1029 620H980V345H660V295M980 345H908V295M980 345H1035V285" class="hot"/>

  <!-- Узлы и подписи -->
  <g>
    <rect x="948" y="570" width="36" height="98" rx="8" fill="#fff" stroke="#4f8a2d" stroke-width="5"/>
    <circle cx="966" cy="590" r="6" fill="#1687d9"/><circle cx="966" cy="610" r="6" fill="#1687d9"/><circle cx="966" cy="630" r="6" fill="#e8493f"/><circle cx="966" cy="650" r="6" fill="#e8493f"/>
    <text x="930" y="585" class="small" text-anchor="end">коллекторы</text>
    <circle cx="1080" cy="880" r="13" class="point" stroke="#1687d9"/><text x="1104" y="888" class="small">ввод воды</text>
    <circle cx="940" cy="875" r="13" class="point" stroke="#82613b"/><text x="790" y="918" class="small">выпуск к септику / сети</text>
    <path d="M940 185l-16 26h32z" fill="#82613b"/><text x="965" y="178" class="small">фановый стояк</text>
  </g>

  <!-- Правая панель -->
  <g transform="translate(1160 150)">
    <rect width="380" height="700" rx="22" fill="#fff" stroke="#cbd8c5" stroke-width="3" filter="url(#shadow)"/>
    <text x="30" y="52" class="label">Логика разводки</text>
    <g transform="translate(30 90)">
      <circle cx="18" cy="18" r="18" class="number"/><text x="18" y="18" class="number-text">1</text><text x="52" y="14" class="note">Сгруппировать мокрые зоны</text><text x="52" y="42" class="small">Меньше длина трасс и проходок.</text>
      <circle cx="18" cy="108" r="18" class="number"/><text x="18" y="108" class="number-text">2</text><text x="52" y="104" class="note">Оставить доступ к узлам</text><text x="52" y="132" class="small">Коллекторы, фильтры, ревизии.</text>
      <circle cx="18" cy="198" r="18" class="number"/><text x="18" y="198" class="number-text">3</text><text x="52" y="194" class="note">Не прятать соединения</text><text x="52" y="222" class="small">Неразъёмные соединения —</text><text x="52" y="247" class="small">в доступных зонах.</text>
      <circle cx="18" cy="308" r="18" class="number"/><text x="18" y="308" class="number-text">4</text><text x="52" y="304" class="note">Защитить SIP-панели</text><text x="52" y="332" class="small">Гильзы, герметизация и защита</text><text x="52" y="357" class="small">от протечек в местах прохода.</text>
      <circle cx="18" cy="418" r="18" class="number"/><text x="18" y="418" class="number-text">5</text><text x="52" y="414" class="note">Испытать до зашивки</text><text x="52" y="442" class="small">Опрессовка воды, пролив</text><text x="52" y="467" class="small">канализации, фотофиксация.</text>
    </g>
    <g transform="translate(30 590)">
      <path d="M0 0h50" class="cold"/><text x="67" y="7" class="small">ХВС</text>
      <path d="M142 0h50" class="hot"/><text x="209" y="7" class="small">ГВС</text>
      <path d="M0 53h50" class="sewer"/><text x="67" y="60" class="small">канализация</text>
      <path d="M225 53h50" class="fan"/><text x="290" y="60" class="small">фановая</text>
    </g>
  </g>
  <text x="80" y="965" class="small">Схема для обсуждения. Диаметры, уклоны, напор, материалы и места проходок подтверждаются инжерным проектом.</text>
</svg>
