<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d">
  <title id="t">Прайс-лист и смета</title><desc id="d">Разница между базовой ценой, проектной правкой, подробной и компактной сметой.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-opacity=".15"/></filter><style>.h{font:700 32px Arial,sans-serif;fill:#172016}.tx{font:600 18px Arial,sans-serif;fill:#172016}.sm{font:500 15px Arial,sans-serif;fill:#596555}.box{fill:#fff;stroke:#cbd8c5;stroke-width:2}.green{fill:#edf7e8;stroke:#9bc388;stroke-width:2}.amber{fill:#fff5da;stroke:#e5c26f;stroke-width:2}.n{fill:#4f8a2d}.nt{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}</style></defs>
  <rect width="1400" height="820" fill="#edf3e9"/><text x="55" y="65" class="h">Цены и вид сметы</text>
  <g transform="translate(55 95)" filter="url(#s)"><rect width="620" height="650" rx="24" class="box"/><text x="30" y="52" class="h" font-size="26">Прайс-лист</text><rect x="30" y="80" width="560" height="74" rx="14" class="amber"/><text x="50" y="110" class="tx">Редактирование защищено</text><text x="50" y="136" class="sm">Изменения делает только ответственный менеджер</text><g transform="translate(30 185)"><rect width="560" height="190" rx="14" class="box"/><path d="M0 52h560M0 100h560M0 148h560" stroke="#d7dfd3"/><text x="18" y="34" class="sm">Номенклатура</text><text x="455" y="34" class="sm">Цена</text><text x="18" y="83" class="tx">SIP-панель 174 PPS</text><text x="455" y="83" class="tx">6 543 ₽</text><text x="18" y="131" class="tx">Пеноклей 650 мл</text><text x="455" y="131" class="tx">550 ₽</text><text x="18" y="179" class="tx">Монтаж SIP</text><text x="455" y="179" class="tx">1 200 ₽</text></g><rect x="30" y="405" width="560" height="98" rx="14" class="green"/><text x="50" y="438" class="tx">Правка в смете</text><text x="50" y="466" class="sm">Меняет цену только в этом проекте</text><text x="50" y="489" class="sm">и не переписывает базовый прайс.</text><circle cx="570" cy="105" r="22" class="n"/><text x="570" y="105" class="nt">1</text><circle cx="570" cy="435" r="22" class="n"/><text x="570" y="435" class="nt">2</text></g>
  <g transform="translate(725 95)" filter="url(#s)"><rect width="620" height="650" rx="24" class="box"/><text x="30" y="52" class="h" font-size="26">Смета</text><g transform="translate(30 82)"><rect width="265" height="76" rx="14" fill="#4f8a2d"/><text x="132" y="32" class="tx" fill="#fff" text-anchor="middle">Подробная</text><text x="132" y="56" class="sm" fill="#fff" text-anchor="middle">для менеджера</text><rect x="285" width="275" height="76" rx="14" class="green"/><text x="422" y="32" class="tx" text-anchor="middle">Компактная</text><text x="422" y="56" class="sm" text-anchor="middle">для клиента</text></g><g transform="translate(30 190)"><rect width="560" height="230" rx="14" class="box"/><path d="M0 48h560M0 94h560M0 140h560M0 186h560" stroke="#d7dfd3"/><text x="18" y="31" class="sm">Строка сметы</text><text x="450" y="31" class="sm">Сумма</text><text x="18" y="79" class="tx">SIP-панели пола</text><text x="450" y="79" class="tx">420 000 ₽</text><text x="18" y="125" class="tx">Соединительный брус</text><text x="450" y="125" class="tx">88 000 ₽</text><text x="18" y="171" class="tx">Комплект монтажа пола</text><text x="450" y="171" class="tx">46 500 ₽</text><text x="18" y="217" class="tx">Сборка пола</text><text x="450" y="217" class="tx">155 000 ₽</text></g><g transform="translate(30 452)"><rect width="560" height="122" rx="14" class="green"/><text x="22" y="36" class="tx">Гибкая выдача</text><text x="22" y="65" class="sm">Можно скрыть работы или сопутствующий крепёж,</text><text x="22" y="91" class="sm">не изменяя внутренний расчёт менеджера.</text></g><circle cx="570" cy="112" r="22" class="n"/><text x="570" y="112" class="nt">3</text><circle cx="570" cy="500" r="22" class="n"/><text x="570" y="500" class="nt">4</text></g>
</svg>
