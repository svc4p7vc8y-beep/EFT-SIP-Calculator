<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="t d">
  <title id="t">Редактор плана дома</title><desc id="d">Основные зоны редактора: инструменты, слои, план и сводка.</desc>
  <defs><pattern id="g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#dce6d8"/></pattern><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".14"/></filter><style>.ui{fill:#fff;stroke:#cbd8c5;stroke-width:2}.tx{font:600 18px Arial,sans-serif;fill:#172016}.sm{font:500 14px Arial,sans-serif;fill:#53604e}.wall{stroke:#172016;stroke-width:13;fill:#faf8ec}.part{stroke:#172016;stroke-width:7}.room{font:700 19px Arial,sans-serif;fill:#172016;text-anchor:middle}.area{font:500 14px Arial,sans-serif;fill:#4f8a2d;text-anchor:middle}.call{fill:#4f8a2d}.num{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.lead{stroke:#4f8a2d;stroke-width:4;fill:none}</style></defs>
  <rect width="1400" height="850" fill="#edf3e9"/><rect x="25" y="25" width="1350" height="800" rx="25" class="ui" filter="url(#s)"/>
  <rect x="25" y="25" width="1350" height="75" rx="25" fill="#fff"/><text x="55" y="71" class="tx" font-size="26">План дома</text><rect x="210" y="42" width="130" height="42" rx="12" fill="#4f8a2d"/><text x="275" y="68" class="tx" fill="#fff" text-anchor="middle">+ Новый план</text><rect x="360" y="42" width="145" height="42" rx="12" class="ui"/><text x="432" y="68" class="tx" text-anchor="middle">Сохранить план</text>
  <rect x="45" y="120" width="165" height="675" rx="18" fill="#f7faf5" stroke="#cbd8c5" stroke-width="2"/><text x="65" y="153" class="tx">Инструменты</text>
  <g class="sm"><rect x="58" y="175" width="140" height="42" rx="10" fill="#dfefd8"/><text x="78" y="201">↖ Выбор</text><text x="78" y="250">□ Контур дома</text><text x="78" y="298">□ Комната</text><text x="78" y="346">┃ Перегородка</text><text x="78" y="394">▤ Окно</text><text x="78" y="442">◖ Дверь / ворота</text><text x="78" y="490">↔ Размер</text><text x="78" y="538">◉ Сваи</text><text x="78" y="586">▦ Обвязка</text><text x="78" y="634">≡ Терраса</text><text x="78" y="682">⌂ Крыша</text></g>
  <rect x="230" y="120" width="875" height="675" rx="18" fill="url(#g)" stroke="#cbd8c5" stroke-width="2"/>
  <g transform="translate(345 225)"><path d="M0 0H625V450H0Z" class="wall"/><path d="M360 0V450M0 225H625M360 145H625" class="part"/><text x="180" y="105" class="room">Кухня-гостиная</text><text x="180" y="132" class="area">28,4 м²</text><text x="495" y="70" class="room">Санузел</text><text x="495" y="97" class="area">6,2 м²</text><text x="495" y="187" class="room">Котельная</text><text x="495" y="214" class="area">5,7 м²</text><text x="180" y="337" class="room">Спальня 1</text><text x="180" y="364" class="area">17,8 м²</text><text x="495" y="337" class="room">Спальня 2</text><text x="495" y="364" class="area">15,9 м²</text><path d="M150 0h90M625 280v90" stroke="#32bfd6" stroke-width="10"/><path d="M360 300h65" stroke="#159bd0" stroke-width="10"/><path d="M425 300a65 65 0 0 1-65 65" fill="none" stroke="#159bd0" stroke-width="4"/></g>
  <g transform="translate(300 185)"><circle r="22" class="call"/><text class="num">1</text><path d="M18 10L55 35" class="lead"/></g><g transform="translate(1040 180)"><circle r="22" class="call"/><text class="num">2</text><path d="M-18 10l-55 35" class="lead"/></g>
  <rect x="1125" y="120" width="225" height="675" rx="18" fill="#f7faf5" stroke="#cbd8c5" stroke-width="2"/><text x="1147" y="155" class="tx">Сводка проекта</text><g class="sm"><text x="1147" y="200">Габариты</text><text x="1147" y="226" class="tx">10,0 × 7,0 м</text><text x="1147" y="276">Помещения</text><text x="1147" y="302" class="tx">74,0 м²</text><text x="1147" y="352">Перегородки</text><text x="1147" y="378" class="tx">31,4 м</text><text x="1147" y="428">Сваи</text><text x="1147" y="454" class="tx">28 шт</text><text x="1147" y="504">Проверка</text><rect x="1145" y="522" width="180" height="62" rx="12" fill="#e5f3df"/><text x="1160" y="548" class="tx" fill="#316d1c">План согласован</text><text x="1160" y="572">Ошибок нет</text></g>
  <g transform="translate(1090 160)"><circle r="22" class="call"/><text class="num">3</text><path d="M20 0h30" class="lead"/></g>
  <g transform="translate(640 748)"><rect x="-245" y="0" width="490" height="47" rx="13" fill="#fff" stroke="#cbd8c5" stroke-width="2"/><text x="-220" y="29" class="sm">Слои: ◉ сваи   ▦ обвязка   ⌂ крыша   ↔ размеры</text></g>
  <g transform="translate(910 744)"><circle r="22" class="call"/><text class="num">4</text><path d="M-20 0h-45" class="lead"/></g>
</svg>
