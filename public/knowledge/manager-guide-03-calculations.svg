<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d">
  <title id="t">Проверка связей и калькуляторов</title><desc id="d">Калькулятор с зелеными связанными полями, ручной настройкой и ведомостью.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".15"/></filter><style>.h{font:700 32px Arial,sans-serif;fill:#172016}.tx{font:600 18px Arial,sans-serif;fill:#172016}.sm{font:500 15px Arial,sans-serif;fill:#596555}.box{fill:#fff;stroke:#cbd8c5;stroke-width:2}.linked{fill:#edf8e8;stroke:#9bc388;stroke-width:2}.n{fill:#4f8a2d}.nt{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}</style></defs>
  <rect width="1400" height="820" fill="#edf3e9"/><rect x="45" y="35" width="1310" height="750" rx="26" class="box" filter="url(#s)"/><text x="80" y="90" class="h">Проверка расчётного раздела</text>
  <rect x="80" y="120" width="1240" height="70" rx="15" class="linked"/><circle cx="115" cy="155" r="20" class="n"/><text x="115" y="155" class="nt">✓</text><text x="150" y="150" class="tx">Данные связаны с планом</text><text x="150" y="175" class="sm">Зелёные поля обновляются автоматически. Ручная правка отключает только эту связь.</text>
  <g transform="translate(80 225)"><rect width="760" height="205" rx="18" class="box"/><text x="24" y="40" class="tx">Основные параметры</text><g transform="translate(24 65)"><rect width="210" height="90" rx="12" class="linked"/><text x="16" y="28" class="sm">Площадь из плана</text><text x="16" y="61" class="h" font-size="25">112,4 м²</text></g><g transform="translate(255 65)"><rect width="210" height="90" rx="12" class="box"/><text x="16" y="28" class="sm">Толщина панели</text><text x="16" y="61" class="tx">174 мм ▾</text></g><g transform="translate(486 65)"><rect width="245" height="90" rx="12" class="box"/><text x="16" y="28" class="sm">Режим расчёта</text><text x="16" y="61" class="tx">Автоматический ▾</text></g></g>
  <g transform="translate(865 225)"><rect width="455" height="205" rx="18" fill="#f7faf5" stroke="#cbd8c5" stroke-width="2"/><text x="24" y="40" class="tx">Как проверять</text><text x="24" y="78" class="sm">1. Сверьте площади с планом</text><text x="24" y="110" class="sm">2. Проверьте выбор материала</text><text x="24" y="142" class="sm">3. Откройте ведомость</text><text x="24" y="174" class="sm">4. Сверьте единицы и округление</text></g>
  <g transform="translate(80 460)"><rect width="1240" height="270" rx="18" class="box"/><text x="24" y="42" class="tx">Ведомость материалов и работ</text><path d="M24 68h1192M24 112h1192M24 158h1192M24 204h1192" stroke="#d7dfd3" stroke-width="2"/><text x="40" y="98" class="sm">НОМЕНКЛАТУРА</text><text x="625" y="98" class="sm">ЕД.</text><text x="760" y="98" class="sm">КОЛ-ВО</text><text x="970" y="98" class="sm">ЦЕНА</text><text x="1140" y="98" class="sm">СУММА</text><text x="40" y="143" class="tx">SIP-панель 174 PPS</text><text x="625" y="143" class="sm">шт</text><text x="760" y="143" class="tx">42</text><text x="970" y="143" class="tx">6 543</text><text x="1140" y="143" class="tx">274 806 ₽</text><text x="40" y="189" class="tx">Раскрой SIP-панелей</text><text x="625" y="189" class="sm">м²</text><text x="760" y="189" class="tx">118,6</text><text x="970" y="189" class="tx">450</text><text x="1140" y="189" class="tx">53 370 ₽</text><text x="40" y="235" class="tx">Пеноклей для SIP-панелей, 650 мл</text><text x="625" y="235" class="sm">бал.</text><text x="760" y="235" class="tx">21</text><text x="970" y="235" class="tx">550</text><text x="1140" y="235" class="tx">11 550 ₽</text></g>
  <circle cx="1285" cy="145" r="23" class="n"/><text x="1285" y="145" class="nt">1</text><circle cx="815" cy="250" r="23" class="n"/><text x="815" y="250" class="nt">2</text><circle cx="1290" cy="485" r="23" class="n"/><text x="1290" y="485" class="nt">3</text>
</svg>
