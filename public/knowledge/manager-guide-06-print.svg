<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="t d">
  <title id="t">Проверка и печать коммерческого предложения</title><desc id="d">Макет первой страницы с шапкой, суммами, планом дома и составом предложения.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".18"/></filter><style>.h{font:700 28px Arial,sans-serif;fill:#172016}.tx{font:600 17px Arial,sans-serif;fill:#172016}.sm{font:500 13px Arial,sans-serif;fill:#596555}.wall{fill:#faf8ec;stroke:#172016;stroke-width:8}.part{stroke:#172016;stroke-width:4}.dim{stroke:#5a6657;stroke-width:2}.n{fill:#4f8a2d}.nt{font:700 19px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}</style></defs>
  <rect width="1400" height="850" fill="#e9f0e6"/><rect x="240" y="25" width="920" height="800" rx="8" fill="#fff" filter="url(#s)"/><path d="M265 50h870v750H265z" fill="none" stroke="#74a65a" stroke-width="3"/>
  <g transform="translate(290 70)"><path d="M0 32l35-25 35 25v35H0z" fill="#4f8a2d"/><path d="M12 35l23-16 23 16" fill="none" stroke="#fff" stroke-width="6"/><text x="88" y="36" class="h">ЭФТ</text><text x="88" y="60" class="sm">ЭнергоЭффективные Технологии</text><text x="815" y="35" class="h" text-anchor="end">КОММЕРЧЕСКОЕ</text><text x="815" y="64" class="h" text-anchor="end">ПРЕДЛОЖЕНИЕ</text></g>
  <g transform="translate(290 160)"><rect width="250" height="72" rx="12" fill="#f2f7ef"/><text x="18" y="27" class="sm">МАТЕРИАЛЫ</text><text x="18" y="56" class="h" font-size="23">3 680 000 ₽</text><rect x="270" width="250" height="72" rx="12" fill="#f2f7ef"/><text x="288" y="27" class="sm">РАБОТЫ</text><text x="288" y="56" class="h" font-size="23">2 770 000 ₽</text><rect x="540" width="280" height="72" rx="12" fill="#dfeeda"/><text x="558" y="27" class="sm">ИТОГО</text><text x="558" y="56" class="h" font-size="23" fill="#3d7625">6 450 000 ₽</text></g>
  <g transform="translate(390 285)"><path d="M0 0H620V300H0Z" class="wall"/><path d="M350 0V300M0 150H620M350 100H620" class="part"/><text x="175" y="72" class="tx" text-anchor="middle">Кухня-гостиная</text><text x="175" y="99" class="sm" text-anchor="middle">28,4 м²</text><text x="485" y="52" class="tx" text-anchor="middle">Санузел</text><text x="485" y="79" class="sm" text-anchor="middle">6,2 м²</text><text x="485" y="126" class="tx" text-anchor="middle">Котельная</text><text x="175" y="228" class="tx" text-anchor="middle">Спальня 1</text><text x="485" y="228" class="tx" text-anchor="middle">Спальня 2</text><path d="M145 0h80M620 180v70" stroke="#2ebcd3" stroke-width="8"/><path d="M350 200h55M405 200a55 55 0 0 1-55 55" fill="none" stroke="#1687d9" stroke-width="3"/><path d="M-25-25H645M-25-33v16M645-33v16M-33-25V325M-41-25h16M-41 325h16" class="dim"/><text x="310" y="-34" class="sm" text-anchor="middle">10 000 мм</text><text x="-52" y="150" class="sm" transform="rotate(-90 -52 150)" text-anchor="middle">7 000 мм</text></g>
  <g transform="translate(290 645)"><text class="h" font-size="22">Что входит в предложение</text><rect y="25" width="820" height="105" rx="12" fill="#f6f9f4" stroke="#d6e1d1"/><text x="18" y="54" class="tx">SIP-домокомплект</text><text x="18" y="82" class="sm">Пол, наружные стены, потолок, перегородки, панели, брус, раскрой и комплект монтажа.</text><text x="18" y="108" class="sm">Кровля, фундамент, отделка и инженерия — только если включены в смету.</text></g>
  <circle cx="1080" cy="175" r="22" class="n"/><text x="1080" y="175" class="nt">1</text><circle cx="1040" cy="300" r="22" class="n"/><text x="1040" y="300" class="nt">2</text><circle cx="1080" cy="670" r="22" class="n"/><text x="1080" y="670" class="nt">3</text>
