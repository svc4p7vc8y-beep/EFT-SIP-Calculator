<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d">
  <title id="t">Рабочий маршрут менеджера в EFT SIP Calculator</title><desc id="d">Семь этапов от заявки до коммерческого предложения.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbf5"/><stop offset="1" stop-color="#e9f2e3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20351b" flood-opacity=".16"/></filter><style>.h{font:700 38px Arial,sans-serif;fill:#172016}.sub{font:500 20px Arial,sans-serif;fill:#52604e}.card{fill:#fff;stroke:#c8d9bf;stroke-width:3}.n{fill:#4f8a2d}.nt{font:700 25px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.ct{font:700 23px Arial,sans-serif;fill:#172016}.cs{font:500 17px Arial,sans-serif;fill:#52604e}.arrow{fill:none;stroke:#79a85f;stroke-width:8;stroke-linecap:round}</style></defs>
  <rect width="1400" height="800" rx="30" fill="url(#bg)"/><text x="70" y="78" class="h">От заявки до готового предложения</text><text x="70" y="115" class="sub">Один проект связывает план, конструктив, прайс, смету и печать</text>
  <path d="M235 270H385M565 270H715M895 270H1045M1135 350V455M1045 535H895M715 535H565" class="arrow"/><path d="M375 254l28 16-28 16M705 254l28 16-28 16M1035 254l28 16-28 16M1119 445l16 28 16-28M905 519l-28 16 28 16M725 519l-28 16 28 16" fill="#79a85f"/>
  <g filter="url(#s)">
    <g transform="translate(55 185)"><rect width="180" height="170" rx="20" class="card"/><circle cx="35" cy="35" r="24" class="n"/><text x="35" y="35" class="nt">1</text><text x="22" y="90" class="ct">Заявка</text><text x="22" y="121" class="cs">Клиент, адрес,</text><text x="22" y="146" class="cs">задача и бюджет</text></g>
    <g transform="translate(385 185)"><rect width="180" height="170" rx="20" class="card"/><circle cx="35" cy="35" r="24" class="n"/><text x="35" y="35" class="nt">2</text><text x="22" y="90" class="ct">План</text><text x="22" y="121" class="cs">Контур, комнаты,</text><text x="22" y="146" class="cs">проёмы, этажи</text></g>
    <g transform="translate(715 185)"><rect width="180" height="170" rx="20" class="card"/><circle cx="35" cy="35" r="24" class="n"/><text x="35" y="35" class="nt">3</text><text x="22" y="90" class="ct">Конструктив</text><text x="22" y="121" class="cs">SIP, сваи, кровля,</text><text x="22" y="146" class="cs">терраса</text></g>
    <g transform="translate(1045 185)"><rect width="180" height="170" rx="20" class="card"/><circle cx="35" cy="35" r="24" class="n"/><text x="35" y="35" class="nt">4</text><text x="22" y="90" class="ct">Комплектация</text><text x="22" y="121" class="cs">Инженерия,</text><text x="22" y="146" class="cs">отделка, доставка</text></g>
    <g transform="translate(1045 455)"><rect width="180" height="170" rx="20" class="card"/><circle cx="35" cy="35" r="24" class="n"/><text x="35" y="35" class="nt">5</text><text x="22" y="90" class="ct">Цены</text><text x="22" y="121" class="cs">Прайс и правки</text><text x="22" y="146" class="cs">только в проекте</text></g>
    <g transform="translate(715 455)"><rect width="180" height="170" rx="20" class="card"/><circle cx="35" cy="35" r="24" class="n"/><text x="35" y="35" class="nt">6</text><text x="22" y="90" class="ct">Проверка</text><text x="22" y="121" class="cs">Связи, ошибки,</text><text x="22" y="146" class="cs">полнота сметы</text></g>
    <g transform="translate(385 455)"><rect width="180" height="170" rx="20" class="card"/><circle cx="35" cy="35" r="24" class="n"/><text x="35" y="35" class="nt">7</text><text x="22" y="90" class="ct">Выдача</text><text x="22" y="121" class="cs">Компактная смета,</text><text x="22" y="146" class="cs">PDF и файл проекта</text></g>
  </g>
  <rect x="55" y="690" width="1170" height="55" rx="16" fill="#dfeeda"/><text x="80" y="725" class="sub" fill="#28521b">Правило: после каждого важного этапа сохраняйте файл .eft.json на диск</text>
</svg>
